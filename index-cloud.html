<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <meta name="theme-color" content="#0c1420" />
  <title>Pump Tracker - Cloud Sync</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#0c1420; overflow:hidden; }
    iframe { width:100%; height:100%; border:0; display:block; }
    .note { position:fixed; top:10px; left:10px; right:10px; z-index:10; background:#152033; color:#c4d0e2; border:1px solid #314665; border-radius:12px; padding:10px 12px; font:12px system-ui; box-shadow:0 8px 28px rgba(0,0,0,.35); }
    .note strong { color:#38bdf8; }
    .note.hide { display:none; }
  </style>
</head>
<body>
  <div class="note" id="startupNote">
    <strong>Cloud version:</strong> open the Cloud button at bottom-left to sign in and sync between devices.
  </div>
  <iframe src="./index.html" title="Pump Cartridge Installation Tracker"></iframe>

  <script>
    setTimeout(() => {
      const n = document.getElementById('startupNote');
      if (n) n.classList.add('hide');
    }, 5000);
  </script>
  <script src="supabase-config.js"></script>
  <script type="module" src="cloud-sync.js"></script>
</body>
</html>
